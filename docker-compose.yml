services:

  # 1. Core Agent Logic
  agent:
    build: 
      context: . 
    container_name: veracli_agent
    restart: always # ADDED: Ensures it restarts if it exits again
    command: ["sleep", "infinity"] # CHANGED: Forces the container to stay alive
    ports:
      - "8001:8001"
    volumes:
      - ~/.veracode/credentials:/root/.veracode/credentials:ro
    networks:
      - veranet

  # 2. Agent API Server (The CLI Executor - NEEDS the credentials)
  agent_api:
    build: 
      context: . 
    container_name: veracli_agent_api
    environment:
      AGENT_URL: "http://agent:8001/query"
    command: ["uvicorn", "agent_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ~/.veracode/credentials:/root/.veracode/credentials:ro
    depends_on:
      - agent
    networks:
      - veranet

  # 3. Web UI (Primary Frontend)
  web_ui:
    build: 
      context: . 
    container_name: veracli_web_ui
    environment:
      AGENT_API_URL: "http://agent_api:8000/run"
    command: ["python", "web_ui/server.py"]
    ports:
      - "3000:3000"
    volumes:
      - ~/.veracode/credentials:/root/.veracode/credentials:ro
    depends_on:
      - agent_api
    networks:
      - veranet

