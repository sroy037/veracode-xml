<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veracli Web Shell</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* Base Styling and Variables (Optimized for Application Shell) */
        :root {
            --primary-color: #0077B6; 
            --primary-light: #e0f0ff;
            --background-color: #f7f9fc;
            --sidebar-background: #ffffff; 
            --console-background: #1e1e1e;
            --console-text: #f0f0f0;
            --border-color: #e0e0e0;
            --success-color: #4caf50;
            --error-color: #f44336;
            --text-color: #222;
            --light-text: #777;
            --secondary-btn-color: #999; /* For the Clear button */
            --secondary-btn-bg: #f0f0f0;
            --warning-color: #ff9800;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            height: 100%; 
            overflow: hidden; 
        }

        /* --- New Application Shell Layout (CSS Grid) --- */
        #app-layout {
            display: grid;
            grid-template-areas: 
                "header header"
                "sidebar main"
                "sidebar footer";
            grid-template-columns: 350px 1fr; 
            grid-template-rows: auto 1fr 45px; 
            height: 100vh;
            max-width: 100vw;
        }

        /* --- Header / Status Bar --- */
        #app-header {
            grid-area: header;
            background-color: var(--sidebar-background);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 14px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        #header-controls {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        #app-header h1 {
            font-size: 1.05em;
            font-weight: 700;
            color: var(--text-color);
            margin: 0;
            letter-spacing: -0.2px;
        }
        #settings-selectors {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            justify-content: flex-start;
            min-width: 220px;
        }

        #status-bar {
            font-size: 0.9em;
            color: var(--light-text);
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
        }
        /* Smaller header buttons to reduce visual weight */
        #app-header .btn {
            padding: 6px 10px;
            font-size: 0.85em;
            border-radius: 6px;
        }
        /* Select sizing in header */
        #settings-selectors select {
            padding: 6px 10px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: white;
            color: var(--text-color);
            box-shadow: none;
        }
        #region-select { width: 150px; }
        #env-select { width: 180px; max-width: 40vw; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--error-color); }
        .status-dot.connected { background-color: var(--success-color); }
        /* Tooltip for checkbox */
        .tooltip-wrapper { position: relative; display: inline-block; }
        .tooltip-icon { font-size: 0.92em; color: var(--primary-color); margin-left:6px; cursor:help; }
        .tooltip-box {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            background: #fff;
            color: #222;
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            white-space: nowrap;
            z-index: 1200;
            visibility: hidden;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.12s ease, transform 0.12s ease;
            font-size: 0.85em;
        }
        .tooltip-wrapper:hover .tooltip-box,
        .tooltip-wrapper:focus-within .tooltip-box { visibility: visible; opacity: 1; transform: translateY(0); }
        
        /* --- Left Sidebar (Input Controls) --- */
        #command-sidebar {
            grid-area: sidebar;
            background-color: var(--sidebar-background);
            padding: 20px;
            overflow-y: auto; 
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- Main Console Area (Center) --- */
        #cli-container {
            grid-area: main;
            display: flex;
            flex-direction: column;
            background-color: var(--console-background);
            overflow: hidden; 
        }

        /* --- Console Output --- */
        #console {
            background-color: var(--console-background);
            color: var(--console-text);
            padding: 15px;
            white-space: pre; 
            font-family: monospace;
            font-size: 0.85em;
            line-height: 1.4;
            overflow-y: scroll; 
            overflow-x: auto; 
            flex-grow: 1;
            height: 100%; 
        }

        /* --- Footer Input (CLI) --- */
        #cli-input-container {
            grid-area: footer;
            background-color: #333;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            border-top: 1px solid #555;
            z-index: 10;
        }
        #cli-prompt { color: #b0e0a0; margin-right: 5px; font-family: monospace; font-size: 1em; }
        #cli-input { background: none; border: none; color: var(--console-text); font-family: monospace; font-size: 1em; flex-grow: 1; outline: none; padding: 0; caret-color: var(--console-text); }


        /* --- Styling for Collapsible Sections (The new `details` element) --- */
        .card { 
            padding: 0; 
            box-shadow: none; 
            background: none; 
            border: 1px solid var(--border-color); /* Added border for card grouping */
            border-radius: 6px;
        }

        details {
            padding: 0;
            margin: 0;
        }

        .card-title {
            /* Now applied to the <summary> element */
            font-weight: 600;
            font-size: 0.95em; 
            color: var(--primary-color);
            padding: 10px 15px; /* Added padding to the title area */
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            list-style: none; /* Hide default triangle in some browsers */
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.15s;
        }
        
        /* Style for the title bar when the section is closed */
        details:not([open]) .card-title {
             border-bottom: none; /* No border if closed */
        }

        /* Tweak for Firefox/Edge to hide the default triangle */
        details > summary::-webkit-details-marker,
        details > summary::marker {
            display: none;
        }
        
        .card-title i {
            font-size: 1.1em;
            color: var(--primary-color);
            transition: transform 0.2s;
        }

        /* Rotate arrow down when open */
        details[open] .card-title i.collapse-icon {
            transform: rotate(90deg);
        }
        /* Default arrow right when closed */
        details:not([open]) .card-title i.collapse-icon {
            transform: rotate(0deg);
        }

        /* Content area inside the collapsible card */
        .card-content {
            padding: 10px 15px 15px 15px;
        }

        /* Input, buttons, segmented controls styles (inside .card-content) */
        .input-group { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            flex-wrap: wrap; 
            margin-bottom: 8px; /* Added space between groups */
        }
        
        /* EXPANDED TEXT INPUT STYLING */
        #app-name-input, #xml-target-input, #build-id-input, #det-xml-target-input, #det-build-id-input, #report-filename-prefix, #mit-app-name-input, #mit-file-name-input, #user-input, #search-input, #api-input { 
            flex-grow: 1;
            width: 100%; 
            margin-top: 5px;
            margin-bottom: 5px;
        }
        
        input[type="text"], input[type="password"], select { 
            padding: 7px 10px; 
            font-size: 0.9em; 
            border-radius: 4px; 
            box-sizing: border-box; 
            border: 1px solid var(--border-color);
        }

        .btn { 
            padding: 7px 10px; 
            font-size: 0.8em; 
            font-weight: 600; 
            border-radius: 4px; 
            cursor: pointer;
            transition: background-color 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-primary { 
            background-color: var(--primary-color); 
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #005a92;
        }
        .btn-outline { 
            padding: 6px 9px; 
            background: none;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
        .btn-outline:hover {
            background-color: var(--primary-light);
        }
        
        /* New Clear Button Style */
        .btn-secondary {
            background-color: var(--secondary-btn-bg);
            color: var(--secondary-btn-color);
            border: 1px solid #ddd;
        }
        .btn-secondary:hover {
            background-color: #e0e0e0;
        }

        .segmented-control { 
            display: flex; 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            overflow: hidden;
        }
        .segmented-control input[type="radio"] {
            display: none;
        }
        .segmented-control label { 
            padding: 5px 8px; 
            font-size: 0.75em; 
            cursor: pointer;
            transition: background-color 0.2s;
            color: var(--light-text);
        }
        .segmented-control input[type="radio"]:checked + label {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }
        .segmented-control label:not(:last-child) {
            border-right: 1px solid var(--border-color);
        }

        /* XML Build/Info Alignment Correction */
        .xml-button-group {
            display: flex;
            justify-content: flex-end; /* Push buttons to the right */
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }
        
        /* TIGHTEN REPORT GENERATION SPACING */
        #report-generation-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px; 
        }
        
        /* Responsive Adjustments */
        @media (max-width: 900px) {
            #app-layout {
                grid-template-areas: 
                    "header"
                    "sidebar"
                    "main"
                    "footer";
                grid-template-columns: 1fr;
                grid-template-rows: 60px auto 1fr 45px;
                overflow-y: auto; 
            }
            #command-sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding-top: 10px; /* Adjust padding for mobile */
            }
            .card {
                border-left: none;
                border-right: none;
                border-radius: 0;
            }
            /* Make header controls stack neatly on small screens */
            #app-header { padding: 10px 12px; }
            #header-controls { flex-direction: column; align-items: stretch; gap: 10px; }
            #settings-selectors { justify-content: flex-start; }
            #header-controls > div[style] { width: 100%; display:flex; justify-content:space-between; }
        }
    </style>
</head>
<body>
    <div id="app-layout">

        <div id="app-header">
            <div id="header-top">
                <h1>Veracli Web Shell</h1>
                <div id="status-bar">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="status-text">Disconnected</span>
                </div>
            </div>

            <div id="header-controls">
                <div id="settings-selectors">
                    <select id="region-select">
                        <option value="Commercial">Commercial</option>
                        <option value="European">European</option>
                    </select>
                    <div style="display:inline-flex; gap:8px; align-items:center;">
                        <select id="env-select">
                            <option value="" disabled selected hidden>Select environment</option>
                        </select>
                        <label style="font-size:0.83em; color:var(--light-text); display:inline-flex; align-items:center; gap:6px; margin-left:8px;">
                            <input id="use-default-checkbox" type="checkbox" style="transform:scale(0.95); margin-top:2px;" />
                            <span style="white-space:nowrap;">Environment Blocked</span>
                            <span class="tooltip-wrapper" tabindex="0" aria-hidden="false">
                                <i class="fas fa-info-circle tooltip-icon" aria-hidden="true"></i>
                                <span class="tooltip-box">When checked, you won't be able to select environments</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div style="display:inline-flex; gap:6px; margin-left:8px;">
                    <button id="env-refresh-btn" class="btn btn-secondary" type="button">Refresh</button>
                    <button id="env-add-btn" class="btn btn-secondary" type="button">Add</button>
                    <button id="env-edit-btn" class="btn btn-secondary" type="button">Edit</button>
                    <button id="env-delete-btn" class="btn btn-secondary" type="button">Delete</button>
                </div>

                <div style="margin-left:auto; display:inline-flex; gap:8px; align-items:center;">
                    <button id="clear-all-btn" class="btn btn-primary" onclick="clearAll()">
                        <i class="fas fa-redo-alt" aria-hidden="true"></i> Clear All
                    </button>
                    <button id="help-btn" class="btn btn-outline" onclick="showHelp()">
                        <i class="fas fa-question-circle" aria-hidden="true"></i> Help
                    </button>
                </div>
            </div>
        </div>

        <div id="command-sidebar">
            
            <details class="card" open>
                <summary class="card-title">
                    <i class="fas fa-chevron-right collapse-icon" aria-hidden="true"></i>
                    <span>🌐</span> API Utilities & Credentials
                </summary>
                <div class="card-content">
                    <div class="input-group">
                        <button id="check-creds-btn" class="btn btn-primary" onclick="runCheckApiRest()">
                            <i class="fas fa-lock" aria-hidden="true"></i> Your API Expiry
                        </button>
                        <button id="check-creds-btn" class="btn btn-primary" onclick="runUserListRest()">
                            <i class="fas fa-users" aria-hidden="true"></i> List All Users
                        </button>

                    <div><input type="text" id="user-input" placeholder="Enter User ID..."></div>
                    <div class="input-group">
                        <button id="user-info-rest-btn" class="btn btn-primary" onclick="runUserInfoRest()">
                            <i class="fas fa-info-circle" aria-hidden="true"></i> User Info
                        </button> 
                    </div>

                    <div><input type="text" id="api-input" placeholder="Enter API ID..."></div>
                    <div class="input-group">
                        <button id="api-info-rest-btn" class="btn btn-primary" onclick="runApiCheckRest()">
                            <i class="fas fa-lock" aria-hidden="true"></i> Check API Key Expiry
                        </button> 
                    </div>
                </div>
            </details>

            <details class="card" open>
                <summary class="card-title">
                    <i class="fas fa-chevron-right collapse-icon" aria-hidden="true"></i>
                    <span>🌐</span> Admin Only User Search
                </summary>
                <div class="card-content">
                    <div class="input-group">
                        <span class="tooltip-wrapper" tabindex="0" aria-hidden="false">
                            <i class="fas fa-info-circle tooltip-icon" aria-hidden="true"></i>
                            <span class="tooltip-box">Scope - Your Platform User-List</span>
                        </span>
                    </div>

                    <div class="segmented-control">
                        <input type="radio" id="api_name" name="search_type_list" value="name" checked>
                        <label for="api_name">User Name</label>
                        <input type="radio" id="api_email" name="search_type_list" value="email">
                        <label for="api_email">E-mail</label>
                        <input type="radio" id="api_id" name="search_type_list" value="api_id">
                        <label for="api_id">API ID</label>
                    </div>

                    <div><input type="text" id="search-input" placeholder="Seach Value..."></div>

                    <div class="input-group">
                        <button id="user-search-rest-btn" class="btn btn-primary" onclick="runUserSearchRest()">
                            <i class="fas fa-search" aria-hidden="true"></i> User Search
                        </button> 
                    </div>
                </div>
            </details>
            
            <details class="card">
                <summary class="card-title">
                    <i class="fas fa-chevron-right collapse-icon" aria-hidden="true"></i>
                    <span>🔍</span> Application Lookup & Reports
                </summary>
                <div class="card-content">
                    <div class="input-group">
                        <div class="segmented-control">
                            <input type="radio" id="api_rest" name="api_type_list" value="REST" checked>
                            <label for="api_rest">REST</label>
                            <input type="radio" id="api_xml" name="api_type_list" value="XML">
                            <label for="api_xml">XML</label>
                        </div>

                        <div>
                            <button id="list-apps-btn" class="btn btn-outline" onclick="listApplications()">
                                <i class="fas fa-list-alt" aria-hidden="true"></i> List Apps
                            </button>
                        </div>
                    </div>

                    <div><input type="text" id="app-name-input" placeholder="Enter App Name..."></div>
                    <div class="input-group">
                        <button id="app-info-rest-btn" class="btn btn-primary" onclick="runAppInfoRest()">
                            <i class="fas fa-info-circle" aria-hidden="true"></i> App Info
                        </button>
                        <button id="summary-report-btn" class="btn btn-primary" onclick="runSummaryReportRest()">
                            <i class="fas fa-book" aria-hidden="true"></i> Summary Report
                        </button>
                    </div>
                </div>
            </details>

            
            <details class="card">
                <summary class="card-title">
                    <i class="fas fa-chevron-right collapse-icon" aria-hidden="true"></i>
                    <span>⚙️</span> Scan Details [XML Utility]
                </summary>
                <div class="card-content">
                    <div class="input-group" style="justify-content: space-between;">
                        <div class="segmented-control" style="width: 130px;">
                            <input type="radio" id="target_id" name="target_type" value="ID" checked>
                            <label for="target_id">App ID</label>
                            <input type="radio" id="target_name" name="target_type" value="Name">
                            <label for="target_name">App Name</label>
                        </div>
                        <div class="segmented-control" style="width: 130px;">
                            <input type="radio" id="scan_static" name="scan_type" value="ss" checked>
                            <label for="scan_static">Static</label>
                            <input type="radio" id="scan_dynamic" name="scan_type" value="ds">
                            <label for="scan_dynamic">Dynamic</label>
                        </div>
                    </div>

                    <div><input type="text" id="xml-target-input" placeholder="Enter App ID or Name..."></div>

                    <div><input type="text" id="build-id-input" placeholder="Build ID (Optional) e.g., 34534888"></div> 
                    
                    <div class="xml-button-group">
                        <button id="build-list-btn" class="btn btn-outline" onclick="runXmlCommand('build_list')">
                            <i class="fas fa-list-ul" aria-hidden="true"></i> Build List
                        </button>
                        <button id="build-info-btn" class="btn btn-primary" onclick="runXmlCommand('build_info')">
                            <i class="fas fa-search" aria-hidden="true"></i> Build Info
                        </button>
                    </div>
                </div>
            </details>

            <details class="card">
                <summary class="card-title">
                    <i class="fas fa-chevron-right collapse-icon" aria-hidden="true"></i>
                    <span>📄</span> Detail Report Generation
                </summary>
                <div class="card-content">
                    <div class="input-group" style="justify-content: space-between;">
                        <div class="segmented-control" style="width: 130px;">
                            <input type="radio" id="det_target_id" name="det_target_type" value="ID" checked>
                            <label for="det_target_id">App ID</label>
                            <input type="radio" id="det_target_name" name="det_target_type" value="Name">
                            <label for="det_target_name">App Name</label>
                        </div>
                        <div class="segmented-control" style="width: 130px;">
                            <input type="radio" id="det_scan_static" name="det_scan_type" value="ss" checked>
                            <label for="det_scan_static">Static</label>
                            <input type="radio" id="det_scan_dynamic" name="det_scan_type" value="ds">
                            <label for="det_scan_dynamic">Dynamic</label>
                        </div>
                    </div>

                    <div><input type="text" id="det-xml-target-input" placeholder="Enter App ID or Name..."></div>

                    <div><input type="text" id="det-build-id-input" placeholder="Build ID (Optional) e.g., 34534888"></div>

                    <div><input type="text" id="report-filename-prefix" placeholder="File Prefix (Default: Veracode_Detailed_Report)"></div>

                    <div id="report-generation-controls">
                        <div class="segmented-control" style="width: 100px;">
                            <input type="radio" id="format_xml" name="report_format" value="XML" checked>
                            <label for="format_xml">XML</label>
                            <input type="radio" id="format_pdf" name="report_format" value="PDF">
                            <label for="format_pdf">PDF</label>
                        </div>
                        <button id="detailed-report-xml-btn" class="btn btn-primary" onclick="runDetailedReportXml()">
                            <i class="fas fa-file-download" aria-hidden="true"></i> Generate & Download
                        </button>
                    </div>
                </div>
            </details>

            <details class="card">
                <summary class="card-title">
                    <i class="fas fa-chevron-right collapse-icon" aria-hidden="true"></i>
                    <span>🛡️</span> Mitigation Review & Actions
                </summary>
                <div class="card-content">
                    <div class="input-group" style="justify-content: space-between; margin-bottom: 10px;">
                        <div class="segmented-control" style="width: 130px;">
                            <input type="radio" id="mit_target_name" name="mit_target_type" value="Name" checked>
                            <label for="mit_target_name">App Name</label>
                            <input type="radio" id="mit_target_id" name="mit_target_type" value="ID">
                            <label for="mit_target_id">App ID</label>
                        </div>
                        <div class="segmented-control" style="width: 130px;">
                            <input type="radio" id="mit_scan_static" name="mit_scan_type" value="ss" checked>
                            <label for="mit_scan_static">Static</label>
                            <input type="radio" id="mit_scan_dynamic" name="mit_scan_type" value="ds">
                            <label for="mit_scan_dynamic">Dynamic</label>
                        </div>
                    </div>
                    <div><input type="text" id="mit-app-name-input" placeholder="App Name or ID (e.g., 43786134)"></div>

                    <div><input type="text" id="mit-file-name-input" placeholder="XML Detailed Report"></div>
                    
                    <label for="mit-severity-select" style="font-size: 0.85em; color: var(--light-text); margin-top: 5px; display: block;">Select Severity:</label>
                    <select id="mit-severity-select" style="width: 100%; padding: 7px 10px; font-size: 0.9em; border-radius: 4px; border: 1px solid var(--border-color); box-sizing: border-box; margin-bottom: 10px;">
                        <option value="High & Above">High & Above</option>
                        <option value="High & Medium">High & Medium</option>
                        <option value="Medium & Above">Medium & Above</option>
                        <option value="Medium & Below">Medium & Below</option>
                        <option value="All">All</option>
                        <option value="Very High">Very High</option>
                        <option value="High" selected>High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                        <option value="Very Low">Very Low</option>
                        <option value="Info">Informational</option>
                    </select>

                    <div class="input-group" style="justify-content: flex-end; width: 100%;">
                        <button id="review-mitigation-btn" class="btn btn-primary" style="background-color: #d9534f;" onclick="runMitigationReview()">
                            <i class="fas fa-gavel" aria-hidden="true"></i> Review Mitigations
                        </button>
                    </div>
                </div>
            </details>
            
            <div style="height: 20px;"></div>
        </div>
        
        <div id="cli-container">
            <div id="console">Connecting...  </div>
        </div>

        <div id="env-modal" class="modal" style="display:none;">
            <div id="env-modal-dialog" class="modal-dialog" style="position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:520px; z-index:9999;">
                <div id="env-modal-header" style="cursor:move; padding:10px 12px; background:#f7f7f7; border:1px solid #ddd; border-radius:6px 6px 0 0; display:flex; justify-content:space-between; align-items:center;">
                    <strong id="env-modal-title">Add Environment</strong>
                    <button id="env-modal-close" class="btn" style="padding:2px 8px; font-size:1.1em;">×</button>
                </div>
                <div id="env-modal-body" style="background:#fff; border-left:1px solid #ddd; border-right:1px solid #ddd; padding:12px; border-bottom:1px solid #ddd;">
                    <div style="margin-bottom:8px;">
                        <label style="font-size:0.9em; color:#444; display:block; margin-bottom:6px;">Environment Name</label>
                        <input id="env-modal-name" type="text" placeholder="e.g. dev" style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;">
                    </div>
                    
                    <div style="margin-bottom:8px;">
                        <label style="font-size:0.9em; color:#444; display:block; margin-bottom:6px;">
                            <strong>Passphrase (Required for security)</strong>
                        </label>
                        <input id="env-modal-passphrase" type="password" placeholder="Enter a secure passphrase" style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;">
                    </div>
                    <div>
                        <label style="font-size:0.9em; color:#444; display:block; margin-bottom:6px;">Credentials (KEY=VALUE lines)</label>
                        <textarea id="env-modal-content" rows="10" style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px; font-family:monospace;"></textarea>
                    </div>
                </div>
                <div id="env-modal-footer" style="display:flex; justify-content:flex-end; gap:8px; padding:10px; background:transparent;">
                    <button id="env-modal-copy" class="btn btn-outline">Copy Example</button>
                    <button id="env-modal-cancel" class="btn btn-secondary">Cancel</button>
                    <button id="env-modal-save" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>

        <div id="cli-input-container">
            <span id="cli-prompt">> </span>
            <input type="text" id="cli-input" autofocus onkeydown="handleKeydown(event)">
        </div>

    </div>

    <script>
        const socket = io();
        const consoleOutput = document.getElementById('console');
        const cliInput = document.getElementById('cli-input');
        const cliPrompt = document.getElementById('cli-prompt');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const regionSelect = document.getElementById('region-select');
        const envSelect = document.getElementById('env-select');
        const useDefaultCheckbox = document.getElementById('use-default-checkbox');

        let commandHistory = [];
        let historyIndex = -1;
        
        const DEFAULT_PREFIX = "Veracode_Detailed_Report"; 
        
        // New: Get all details elements for accordion behavior
        const detailsElements = document.querySelectorAll('#command-sidebar details');
        
        // *** NEW: TRACK AUTHORIZED ENVIRONMENT ***
        let authorizedEnv = null; 
        // ----------------------------------------
        
        // --- NEW: Button State Management Functions ---
        // Disables all primary action buttons and the CLI input
        function disableButtons() {
            // Select all buttons used for sending commands
            const commandButtons = document.querySelectorAll('.card-content .btn-primary, .card-content .btn-outline, #clear-all-btn, #help-btn');
            commandButtons.forEach(button => {
                button.disabled = true;
                button.style.opacity = '0.5'; // Optional: Visual feedback
            });
            cliInput.disabled = true;
            statusText.textContent = 'Executing command... (Please Wait)';
        }

        // Enables all primary action buttons and the CLI input
        function enableButtons() {
            const commandButtons = document.querySelectorAll('.card-content .btn-primary, .card-content .btn-outline, #clear-all-btn, #help-btn');
            commandButtons.forEach(button => {
                button.disabled = false;
                button.style.opacity = '1';
            });
            // Re-enable the CLI input is handled by cli_prompt, but restore status text here
            statusText.textContent = statusDot.classList.contains('connected') ? 'Connected' : 'Disconnected';
            cliInput.focus();
        }

        // Function to enable/disable all primary action buttons in the sidebar
        function setSidebarButtonsEnabled(enabled) {
            // Select all buttons inside the card-content areas (the main command buttons)
            const commandButtons = document.querySelectorAll('.card-content .btn-primary, .card-content .btn-outline');
            commandButtons.forEach(button => {
                button.disabled = !enabled;
                button.style.opacity = enabled ? '1' : '0.5';
            });
        }

        // ---------------------------------------------

        // --- New: Accordion Behavior Listener ---
        function setupAccordion() {
            detailsElements.forEach(details => {
                // Ensure only the first one is open initially, remove 'open' from all others
                if (details !== detailsElements[0]) {
                    details.removeAttribute('open');
                }

                // Add event listener to each details summary (when it's clicked)
                details.addEventListener('toggle', (event) => {
                    // Check if the current details element is being opened
                    if (event.target.open) {
                        // Collapse all other details elements
                        detailsElements.forEach(otherDetails => {
                            if (otherDetails !== event.target) {
                                otherDetails.removeAttribute('open');
                            }
                        });
                    }
                });
            });
        }
        
        // --- Console Message Handling (Replaces alert/confirm and adds success/warning colors) ---
        function displayMessage(message, type = 'system') {
            const color = type === 'user' ? '#b0e0a0' : 
                          type === 'system' ? 'var(--primary-color)' : 
                          type === 'success' ? 'var(--success-color)' : 
                          type === 'warning' ? 'var(--warning-color)' : 
                          'var(--error-color)';
            consoleOutput.innerHTML += `<span style="color: ${color};">${message}</span>\n`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        // --- File Download Utility ---
        function downloadFile(base64Content, fileName, mimeType) {
            try {
                // 1. Decode the base64 string to a raw binary string
                const binaryString = atob(base64Content);
                const len = binaryString.length;
                
                // 2. Convert the binary string into a byte array (Uint8Array)
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    // Get the character code (byte value) at each position
                    bytes[i] = binaryString.charCodeAt(i); 
                }

                // 3. Create a Blob (Binary Large Object) from the byte array
                // The bytes array holds the true, uncorrupted binary data of the file (PDF or XML).
                const blob = new Blob([bytes], { type: mimeType }); 
                
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                URL.revokeObjectURL(url);
            } catch (error) {
                displayMessage(`❌ Error during download: ${error.message}`, 'error');
            }
        }


        // --- SocketIO Handlers ---
        socket.on('connect', () => {
            console.log('Socket connected.');
            statusDot.classList.add('connected');
            statusText.textContent = 'Connected (Ready to accept commands)';
            // Ensure buttons are enabled on connect
            enableButtons();
            setSidebarButtonsEnabled(false); // Disable sidebar buttons until environments are loaded
        });

        socket.on('disconnect', () => {
            console.log('Socket disconnected.');
            statusDot.classList.remove('connected');
            statusText.textContent = 'Disconnected';
            cliPrompt.textContent = 'OFFLINE: ';
            // Re-enable buttons on disconnect so the user can see the UI is not frozen
            enableButtons(); 
            setSidebarButtonsEnabled(false); // Disable sidebar buttons when disconnected
        });

        socket.on('cli_output', (data) => {
            consoleOutput.innerHTML += data.data;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        });

        socket.on('cli_prompt', (data) => {
            cliPrompt.textContent = data.data;
            cliInput.disabled = false;
            cliInput.focus();
            // Command complete, re-enable sidebar buttons
            enableButtons();
        });

        socket.on('cli_clear_prompt', () => {
            cliInput.value = '';
            cliInput.disabled = true;
        });
        
        // --- File Download Handler (Simulates browser prompt/confirmation) ---
        socket.on('file_download', (data) => {
            if (data && data.content && data.filename) {
                const mimeType = data.mimeType || 'application/octet-stream';
                
                // 1. Display prompt message in console
                displayMessage(`\n📥 File ready for download: ${data.filename}`, 'warning');
                displayMessage(`   Mime Type: ${mimeType}`, 'warning');
                displayMessage(`   Triggering browser download... (Check your browser's download bar)`, 'warning');

                // 2. Trigger actual download
                downloadFile(data.content, data.filename, mimeType);
                
                displayMessage(`\n✅ Download started successfully!`, 'success');
                // Download operation complete, re-enable buttons
                enableButtons(); 
            } else {
                displayMessage("❌ Error: Server did not return valid file content for download.", 'error');
                // Operation failed, re-enable buttons
                enableButtons(); 
            }
        });


        // --- Command Execution Logic ---
        function sendCommand(cmd) {
            if (!cmd.trim() || cliInput.disabled) return;
            
            // Disable buttons immediately upon sending command
            disableButtons(); 

            consoleOutput.innerHTML += `<span style="color: ${cliPrompt.style.color || '#b0e0a0'}">${cliPrompt.textContent}</span>${cmd}\n`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;

            if (commandHistory.length === 0 || commandHistory[0] !== cmd) {
                commandHistory.unshift(cmd);
            }
            historyIndex = -1;
            
            // Determine region from selector and include it in the payload (do not mutate cmd)
            const region = (regionSelect && regionSelect.value === 'European') ? 'eu' : 'us';
            const useDefault = useDefaultCheckbox ? !!useDefaultCheckbox.checked : false;
            const envName = useDefault ? '' : ((envSelect && envSelect.value) ? envSelect.value : '');

            socket.emit('command', {
                cmd: cmd,
                region_select: region,
                env_name: envName,
                use_default: useDefault
            });
        }
        
        function handleKeydown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendCommand(cliInput.value);
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cliInput.value = commandHistory[historyIndex];
                }
            } else if (event.key === 'ArrowDown') {
                event.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    cliInput.value = commandHistory[historyIndex];
                } else if (historyIndex === 0) {
                    historyIndex = -1;
                    cliInput.value = '';
                }
            }
        }

        // --- Clear/Reset Function ---
        function clearAll() {
            // 1. Clear Console Output
            consoleOutput.innerHTML = 'Console cleared. Veracli Shell Connected. Type a command or click a button to begin.';
            
            // 2. Clear all Text Inputs
            document.getElementById('user-input').value = '';
            document.getElementById('api-input').value = '';
            document.getElementById('search-input').value = '';
            document.getElementById('app-name-input').value = '';
            document.getElementById('xml-target-input').value = '';
            document.getElementById('build-id-input').value = '';
            document.getElementById('det-build-id-input').value = '';
            document.getElementById('det-xml-target-input').value = '';
            document.getElementById('report-filename-prefix').value = ''; 
            document.getElementById('mit-file-name-input').value = '';
            document.getElementById('mit-app-name-input').value = ''; // Clear mitigation app name
            cliInput.value = '';
            
            // 3. Reset history index and focus
            commandHistory = [];
            historyIndex = -1;
            cliInput.focus();
            if (envSelect.value === '' || envSelect.value === undefined) {
                useDefaultCheckbox.checked = true;
            }
        }


        // --- Button Command Builders ---
        function runCheckApiRest() {
            sendCommand('veracli api_check');
        }

        function runUserListRest() {
            sendCommand('veracli api_check -u all');
        }

        function runUserInfoRest() {
            const userId = document.getElementById('user-input').value.trim();
            if (userId) {
                sendCommand(`veracli api_check -u ${userId}`);
            } 
            else {
                displayMessage("⚠️ Please enter a User ID.", 'error');
            }
            document.getElementById('user-input').value = '';
        }

        function runApiCheckRest() {
            const apiId = document.getElementById('api-input').value.trim();
            if (apiId) {
                sendCommand(`veracli api_check -i ${apiId}`);
                return;
            } 
            else {
                displayMessage("⚠️ Please enter an API ID.", 'error');
            }
            document.getElementById('api-input').value = '';
        }

        function runUserSearchRest() {
            const searchId = document.getElementById('search-input').value.trim();
            const searchType = document.querySelector('input[name="search_type_list"]:checked').value;
            if (searchId) {
                sendCommand(`veracli api_check -s ${searchType} -v ${searchId}`);
                return;
            } 
            else {
                displayMessage("⚠️ Please enter a Search string.", 'error');
            }
            document.getElementById('search-input').value = '';
        }

        function listApplications() {
            const apiType = document.querySelector('input[name="api_type_list"]:checked').value;
            sendCommand(`list app --api_type ${apiType}`);
        }

        function runAppInfoRest() {
            const appName = document.getElementById('app-name-input').value.trim();
            if (appName) {
                sendCommand(`veracli app_info -n "${appName}" -t REST`);
            } else {
                displayMessage("⚠️ Please enter an Application Name.", 'error');
            }
            document.getElementById('app-name-input').value = '';
        }

        function runSummaryReportRest() {
            const appName = document.getElementById('app-name-input').value.trim();
            if (appName) {
                sendCommand(`veracli summary_report -n "${appName}" -t REST`);
            } else {
                displayMessage("⚠️ Please enter an Application Name.", 'error');
            }
            document.getElementById('app-name-input').value = '';
        }

        // --- Mitigation Review Function (UPDATED) ---
        function runMitigationReview() {
            const appValue = document.getElementById('mit-app-name-input').value.trim();
            const fileValue = document.getElementById('mit-file-name-input').value.trim();
            const severity = document.getElementById('mit-severity-select').value;
            // NEW: Get the selected mode (Name or ID)
            const targetType = document.querySelector('input[name="mit_target_type"]:checked').value; 
            const scanType = document.querySelector('input[name="mit_scan_type"]:checked').value; 

            if (!appValue) {
                if (!fileValue) {
                    displayMessage(`⚠️ Please enter an Application ${targetType} or XML File for mitigation review.`, 'error');
                    return;
                }
            }

            let cmd = '';

            if (appValue) {
                // Determine the flag to use: -i for ID, -n for Name
                const flag = (targetType === 'ID') ? '-i' : '-n';
                
                // Command format: veracli review_mitigation (-n | -i) "<app_value>" -S "<Severity>"
                cmd = `veracli review_mitigation ${flag} "${appValue}" -S "${severity}"`;
                
                displayMessage(`\n⏳ Requesting mitigation review for app ${targetType}=${appValue} (Severity: ${severity})...`, 'system');
                
                // Only append scan type if the command is NOT 'static'
                if (scanType !== 'ss') {
                    cmd += ` -s ${scanType}`;
                }
                sendCommand(cmd);
            }
            else if (fileValue) {
                if (fileValue.slice(-3).toLowerCase() === 'xml') {
                    cmd = `veracli review_mitigation -f "${fileValue}" -S "${severity}"`;
                    
                    displayMessage(`\n⏳ Requesting mitigation review for file ${fileValue} (Severity: ${severity})...`, 'system');

                    // Only append scan type if the command is NOT 'static'
                    if (scanType !== 'ss') {
                        cmd += ` -s ${scanType}`;
                    }
                    sendCommand(cmd);
                }
                else {
                    displayMessage(`⚠️ Please enter an XML File for mitigation review.`, 'error');
                    return;
                }
            }
            document.getElementById('report-filename-prefix').value = ''; 
            document.getElementById('mit-file-name-input').value = '';
            document.getElementById('mit-app-name-input').value = '';
        }
        // -------------------------------------

        function runXmlCommand(commandType) {
            const targetType = document.querySelector('input[name="target_type"]:checked').value;
            const targetValue = document.getElementById('xml-target-input').value.trim();
            
            const scanType = document.querySelector('input[name="scan_type"]:checked').value; 
            const buildId = document.getElementById('build-id-input').value.trim();
            
            if (!targetValue) {
                displayMessage(`⚠️ Please enter the Application ${targetType}.`, 'error');
                return;
            }

            let cmd = `veracli ${commandType}`;
            
            if (targetType === 'ID') {
                cmd += ` -i ${targetValue}`;
            } else {
                cmd += ` -n "${targetValue}"`;
            }

            // Only append scan type if the command is NOT 'build_list'
            if (commandType !== 'build_list') {
                cmd += ` -s ${scanType}`;
            }

            // region will be handled centrally by sendCommand via payload; do not append to cmd here
            
            // Prepend '-b' to the build ID if it exists
            if (buildId) {
                cmd += ` -b ${buildId}`; 
            }
            sendCommand(cmd);
            document.getElementById('xml-target-input').value = '';
            document.getElementById('build-id-input').value = '';
        }

        function runDetailedReportXml() {
            const targetType = document.querySelector('input[name="det_target_type"]:checked').value;
            const targetValue = document.getElementById('det-xml-target-input').value.trim();

            const scanType = document.querySelector('input[name="det_scan_type"]:checked').value; 
            const buildId = document.getElementById('det-build-id-input').value.trim();

            const format = document.querySelector('input[name="report_format"]:checked').value;
            let prefix = document.getElementById('report-filename-prefix').value.trim();

            if (!targetValue) {
                if (!buildId) {
                    displayMessage(`⚠️ Please enter the Application ${targetType} or Build ID for the Detailed Report.`, 'error');
                    return;
                }
            }

            // Set default prefix if none is provided
            if (!prefix) {
                prefix = DEFAULT_PREFIX;
                displayMessage(`ℹ️ No file prefix provided. Using default: "${prefix}"`, 'system');
            }

            let cmd = `veracli detailed_report`;
            
            if (!buildId) {
                if (targetType === 'ID') {
                    cmd += ` -i ${targetValue}`; 
                } else {
                    cmd += ` -n "${targetValue}"`;
                }

                // Only append scan type if the type is NOT 'static'
                if (scanType !== 'ss') {
                    cmd += ` -s ${scanType}`;
                }
            }
            else {
                // Prepend '-b' to the build ID if it exists
                if (buildId) {
                    cmd += ` -b ${buildId}`; 
                }
            }

            // region will be handled centrally by sendCommand via payload; do not append to cmd here

            // Add format (-f) and output prefix (-p) flags
            cmd += ` -f ${format} -p ${prefix}`; 
            
            // Send the command to the server
            sendCommand(cmd);
            
            displayMessage(`\n⏳ Requesting Detailed Report (Format: ${format}, Prefix: "${prefix}") from server...`, 'system');
            displayMessage(`   **The server must send the file content back via the 'file_download' event.**`, 'system');
            document.getElementById('det-build-id-input').value = '';
            document.getElementById('det-xml-target-input').value = '';
        }

        function showHelp() {
            consoleOutput.innerHTML += '\n' +
                '<span style="color: var(--primary-color);">--- HELP ---</span>\n' +
                '1. API Utilities: Check Creds or List Apps (select XML/REST first).\n' +
                '2. REST Lookup: Enter App Name/ID and click App Info or Summary Report.\n' +
                '3. XML Commands: Fill App ID/Name, select Scan Type, optionally Build ID, then click Build List/Info.\n' +
                '4. XML Reports: Use the App ID/Name field, select **Format** (XML/PDF), optionally set a **Prefix**, and click **Generate & Download**.\n' +
                '5. Mitigation Review: Enter App Name/ID, **select ID/Name mode**, choose **Severity**, and click **Review Mitigations**.\n' +
                '6. Direct Command: Type any Veracli command in the prompt below.\n' +
                '--------------------\n';
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            cliInput.focus();
        }

        // --- Environment Modal Helpers (Open / Close / Save / Drag) ---
        const ENV_EXAMPLE = `VERACODE_API_KEY_ID=YOUR_API_KEY_ID\nVERACODE_API_KEY_SECRET=YOUR_API_KEY_SECRET`;
        
        // Refresh environments list (global so modal can call it)
        function refreshEnvs() {
            fetch('/environments')
                .then(r => r.json())
                .then(list => {
                    if (!envSelect) return;
                    const current = authorizedEnv; // Use authorizedEnv to track what should be selected
                    // Clear existing options and recreate a neutral placeholder
                    envSelect.innerHTML = '';
                    const placeholder = document.createElement('option');
                    placeholder.value = '';
                    placeholder.disabled = true;
                    placeholder.selected = true;
                    placeholder.hidden = true;
                    placeholder.textContent = 'Select environment';
                    envSelect.appendChild(placeholder);
                    list.forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        envSelect.appendChild(opt);
                    });
                    // restore authorized selection if still present
                    if (current) envSelect.value = current;
                })
                .catch(err => console.warn('Failed to refresh envs', err));
        }

        function openEnvModal(mode = 'add', name = '', content = '') {
            const modal = document.getElementById('env-modal');
            const dlg = document.getElementById('env-modal-dialog');
            const title = document.getElementById('env-modal-title');
            const nameInput = document.getElementById('env-modal-name');
            const contentInput = document.getElementById('env-modal-content');
            // *** NEW: Passphrase Input ***
            const passphraseInput = document.getElementById('env-modal-passphrase'); 

            title.textContent = mode === 'edit' ? `Edit Environment: ${name}` : 'Add Environment';
            nameInput.value = name || '';
            passphraseInput.value = ''; // Always clear passphrase input
            
            // For edit mode we will try to fetch existing content if not provided
            if (mode === 'edit' && !content) {
                fetch(`/environments/${encodeURIComponent(name)}`)
                    .then(r => r.ok ? r.json() : Promise.reject(r))
                    .then(j => { if (j && j.content) contentInput.value = j.content; })
                    // Note: We deliberately do NOT fetch the existing passphrase or hash for security
                    .catch(() => { contentInput.value = ''; });
            } else {
                // For Add mode: show example as placeholder (shadow text) when no explicit content provided
                if (mode === 'add') {
                    contentInput.value = '';
                    contentInput.placeholder = content || ENV_EXAMPLE;
                } else {
                    contentInput.placeholder = '';
                    contentInput.value = content || '';
                }
            }

            modal.style.display = 'block';
            // set focus to name if adding; content if editing
            setTimeout(() => {
                // Focus on the passphrase field as it's required for both Add and Edit now
                passphraseInput.focus();
            }, 50);
        }

        function closeEnvModal() {
            const modal = document.getElementById('env-modal');
            const nameInput = document.getElementById('env-modal-name');
            const contentInput = document.getElementById('env-modal-content');
            const passphraseInput = document.getElementById('env-modal-passphrase');
            nameInput.value = '';
            contentInput.value = '';
            passphraseInput.value = ''; // Clear passphrase
            modal.style.display = 'none';
        }

        // Save handler: POST to /environments and refresh list
        function saveEnvFromModal() {
            const name = document.getElementById('env-modal-name').value.trim();
            const content = document.getElementById('env-modal-content').value;
            // *** NEW: Get the Passphrase ***
            const passphrase = document.getElementById('env-modal-passphrase').value;
            
            if (!name) { displayMessage('⚠️ Environment name is required.', 'warning'); return; }
            // *** NEW: Require Passphrase ***
            if (!passphrase) { displayMessage('⚠️ Passphrase is required to protect the environment.', 'warning'); return; }

            // Confirm overwrite if an environment with this name already exists
            const exists = Array.from(document.querySelectorAll('#env-select option')).some(o => o.value === name);
            if (exists) {
                if (!confirm(`Environment '${name}' already exists. Overwrite?`)) {
                    displayMessage('⚠️ Save cancelled by user.', 'warning');
                    return;
                }
            }

            fetch('/environments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // *** NEW: Include content AND passphrase in the body ***
                body: JSON.stringify({ name: name, content: content, passphrase: passphrase })
            }).then(resp => {
                if (resp.status === 201) {
                    displayMessage(`✅ Environment '${name}' saved. **(Passphrase set)**`, 'success');
                    closeEnvModal();
                    // Set as authorized upon saving
                    authorizedEnv = name;
                    envSelect.value = name;
                    refreshEnvs();
                } else {
                    resp.json().then(j => displayMessage(`❌ ${j.error || 'Failed to save environment'}`, 'error'));
                }
            }).catch(err => displayMessage(`❌ Error: ${err}`, 'error'));
        }

        // *** NEW FUNCTION: Handles environment selection and passphrase check ***
        function handleEnvironmentSelection() {
            const selectedEnv = envSelect.value;
            
            // If selecting the placeholder/nothing, reset state
            if (!selectedEnv) {
                authorizedEnv = null;
                updateEnvButtonsState();
                return;
            }

            // If the environment is already authorized, we are done
            if (selectedEnv === authorizedEnv) {
                updateEnvButtonsState();
                return;
            }
            
            // Use a simple prompt for the passphrase
            const passphrase = prompt(`🔑 Please enter the passphrase for environment: ${selectedEnv}`);
            
            if (!passphrase) {
                // User cancelled or entered nothing, revert selection and state
                envSelect.value = authorizedEnv || ''; // Revert to previously authorized or placeholder
                authorizedEnv = authorizedEnv; // Keep the prior authorized state
                updateEnvButtonsState();
                displayMessage('⚠️ Environment selection cancelled or no passphrase provided.', 'warning');
                return;
            }

            // Client-side check complete, now ask the server to validate it
            fetch('/authorize_environment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: selectedEnv, passphrase: passphrase })
            })
            .then(resp => {
                if (resp.ok) {
                    // Success: Authorization successful
                    authorizedEnv = selectedEnv;
                    displayMessage(`✅ Successfully authorized for environment: ${selectedEnv}`, 'success');
                    // Now update UI state, which will enable the buttons/CLI
                    envSelect.value = authorizedEnv;
                } else {
                    // Failure: Authorization failed
                    authorizedEnv = null;
                    envSelect.value = ''; // Clear selection on failure
                    // Try to show server error, otherwise default message
                    resp.json().then(data => {
                        displayMessage(`❌ Authorization failed for ${selectedEnv}. ${data.error || 'Invalid passphrase.'}`, 'error');
                    }).catch(() => {
                        displayMessage(`❌ Authorization failed for ${selectedEnv}. Invalid passphrase.`, 'error');
                    });
                }
            })
            .catch(err => {
                authorizedEnv = null;
                envSelect.value = '';
                displayMessage(`❌ Network Error during authorization: ${err.message}`, 'error');
            });
            updateEnvButtonsState();
        }
        // *** END NEW FUNCTION ***
        
        // Make modal draggable by header
        (function setupModalDrag() {
            let isDown = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;
            const header = document.getElementById('env-modal-header');
            const dlg = document.getElementById('env-modal-dialog');
            if (!header || !dlg) return;

            header.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.clientX;
                startY = e.clientY;
                const rect = dlg.getBoundingClientRect();
                startLeft = rect.left;
                startTop = rect.top;
                dlg.style.transform = 'none';
                dlg.style.left = `${startLeft}px`;
                dlg.style.top = `${startTop}px`;
                dlg.style.position = 'fixed';
                document.body.style.userSelect = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                dlg.style.left = `${startLeft + dx}px`;
                dlg.style.top = `${startTop + dy}px`;
            });

            window.addEventListener('mouseup', () => {
                if (isDown) {
                    isDown = false;
                    document.body.style.userSelect = '';
                }
            });
        })();

        // Wire modal buttons and ESC
        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'env-modal-close') closeEnvModal();
            if (e.target && e.target.id === 'env-modal-cancel') closeEnvModal();
            if (e.target && e.target.id === 'env-modal-save') saveEnvFromModal();
            if (e.target && e.target.id === 'env-modal-copy') {
                // Copy example into clipboard and into the textarea
                const example = ENV_EXAMPLE;
                const ta = document.getElementById('env-modal-content');
                if (ta) {
                    ta.value = example;
                    ta.placeholder = '';
                }
                try { navigator.clipboard.writeText(example); displayMessage('✅ Example copied to clipboard and inserted into editor.', 'success'); } catch (err) { displayMessage('⚠️ Could not copy to clipboard. Example inserted into editor.', 'warning'); }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('env-modal');
                if (modal && modal.style.display === 'block') closeEnvModal();
            }
        });


        // Initialize focus and accordion behavior
        window.onload = () => {
            cliInput.focus();
            setupAccordion();
            cliInput.addEventListener('keydown', handleKeydown);
            useDefaultCheckbox.checked = true;
            
            // Populate environment dropdown from server
            try {
                refreshEnvs();
            } catch (e) {}

            // Wire up environment management buttons
            const refreshBtn = document.getElementById('env-refresh-btn');
            const addBtn = document.getElementById('env-add-btn');
            const editBtn = document.getElementById('env-edit-btn');
            const deleteBtn = document.getElementById('env-delete-btn');

            function updateEnvButtonsState() {
                const useDefault = useDefaultCheckbox && useDefaultCheckbox.checked;
                // Use the AUTHORIZED environment name for state, not the selected one
                const envIsSet = !!authorizedEnv; 
                // Disable CLI if using default or no authorized env
                cliInput.disabled = useDefault || envIsSet;
                setSidebarButtonsEnabled(false);
                
                // If using default, we allow use
                if (useDefault) {
                    if (editBtn) editBtn.disabled = true;
                    if (deleteBtn) deleteBtn.disabled = true;
                    if (editBtn) editBtn.style.opacity = '0.5';
                    if (deleteBtn) deleteBtn.style.opacity = '0.5';
                    if (envSelect) envSelect.disabled = true;
                    setSidebarButtonsEnabled(false);
                    cliInput.disabled = false;
                    cliInput.placeholder = 'Please select and authorize an environment first.';
                    authorizedEnv = null; // Clear authorization state if default is checked
                } else {
                    const selected = true; // We allow edit/delete if environment is selected
                    if (editBtn) editBtn.disabled = !selected;
                    if (deleteBtn) deleteBtn.disabled = !selected;
                    if (editBtn) editBtn.style.opacity = selected ? '1' : '0.5';
                    if (deleteBtn) deleteBtn.style.opacity = selected ? '1' : '0.5';
                    if (envSelect) envSelect.disabled = false;
                    
                    // Enable sidebar and CLI only if an environment is authorized
                    setSidebarButtonsEnabled(selected);
                    cliInput.disabled = !selected;
                    cliInput.placeholder = '';
                }
            }

            // Update state when selection changes
            if (envSelect) envSelect.addEventListener('change', (e) => {
                // If the checkbox is checked (Use Default), just run the state update
                if (useDefaultCheckbox.checked) {
                    updateEnvButtonsState();
                } else {
                    // If the checkbox is unchecked, trigger the security check
                    handleEnvironmentSelection();
                }
            });

            // Wire the Use Default checkbox to toggle select/edit/delete/authorization states
            if (useDefaultCheckbox) {
                useDefaultCheckbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        // clear selection and authorization when switching to default
                        if (envSelect) envSelect.value = '';
                        authorizedEnv = null; 
                    }
                    updateEnvButtonsState();
                });
            }

            if (refreshBtn) refreshBtn.addEventListener('click', refreshEnvs);

            // Add should always open a blank Add modal
            if (addBtn) addBtn.addEventListener('click', () => {
                openEnvModal('add', '', '');
            });

            // Edit opens modal pre-filled for the selected environment
            if (editBtn) editBtn.addEventListener('click', () => {
                const selected = envSelect && envSelect.value;
                if (!selected) {
                    displayMessage('⚠️ Select an environment to edit.', 'warning');
                    return;
                }
                openEnvModal('edit', selected, '');
            });

            if (deleteBtn) deleteBtn.addEventListener('click', () => {
                const name = envSelect && envSelect.value;
                if (!name) { displayMessage('⚠️ Select an environment to delete.', 'warning'); return; }
                if (!confirm(`Delete environment '${name}'? This cannot be undone.`)) return;
                fetch(`/environments/${encodeURIComponent(name)}`, { method: 'DELETE' })
                    .then(resp => resp.json())
                    .then(j => {
                        if (j.ok) {
                            displayMessage(`✅ Environment '${name}' deleted.`, 'success');
                            // Clear authorization state if the deleted env was authorized
                            if (authorizedEnv === name) authorizedEnv = null; 
                            // Re-select placeholder and fall back to default checkbox
                            envSelect.value = '';
                            useDefaultCheckbox.checked = true; 
                            refreshEnvs();
                        } else {
                            displayMessage(`❌ ${j.error || 'Failed to delete'}`, 'error');
                        }
                    }).catch(err => displayMessage(`❌ Error: ${err}`, 'error'));
                useDefaultCheckbox.checked = true;
            });

            // Initialize button states now that elements are wired
            updateEnvButtonsState();
        };

    </script>
</body>
